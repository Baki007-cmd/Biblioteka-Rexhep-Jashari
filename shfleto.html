<!doctype html>
<html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Shfletimi i librit | Rexhep Jashari</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#101510;color:#f2e6cd}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;background:#1c241c;border-bottom:1px solid #705d39}a{color:#e4c78c}h1{font-size:clamp(16px,3vw,23px);margin:0}main{max-width:1400px;margin:auto;padding:14px}p{margin:8px 0;color:#cbbd9e}.toolbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px auto 14px}button,select,input{border:1px solid #a88b56;border-radius:8px;background:#293025;color:#fff;padding:9px 12px;font:inherit}button{cursor:pointer;min-height:42px}button:disabled{opacity:.4;cursor:default}input{width:70px;text-align:center}.stage{min-height:60vh;display:flex;align-items:center;justify-content:center;perspective:1800px;padding:10px 2px 20px}.book{position:relative;display:flex;width:min(100%,1100px);height:min(72vh,760px);filter:drop-shadow(0 16px 20px #0009);transform-style:preserve-3d}.sheet{position:relative;width:50%;height:100%;background:#e7dcc4;overflow:hidden;border:1px solid #a69b85;display:flex;align-items:center;justify-content:center}.sheet:first-child{border-radius:5px 0 0 5px;box-shadow:inset -15px 0 25px #0002}.sheet:last-child{border-radius:0 5px 5px 0;box-shadow:inset 15px 0 25px #0002}.sheet img{display:block;width:100%;height:100%;object-fit:contain;background:#eee7d9}.sheet .empty{color:#675b4d;text-align:center}.spine{position:absolute;z-index:2;left:50%;top:0;bottom:0;width:12px;transform:translateX(-50%);background:linear-gradient(90deg,#0005,#fff2,#0005);pointer-events:none}.turn{position:absolute;z-index:4;top:0;right:0;width:50%;height:100%;background:#e8ddc7;transform-origin:left center;backface-visibility:hidden;pointer-events:none;opacity:0}.turn img{width:100%;height:100%;object-fit:contain}.book.flipping .turn{opacity:1;animation:flip .55s ease-in-out forwards}@keyframes flip{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}.status{text-align:center;min-height:22px}.hint{text-align:center;font-size:13px}@media(max-width:700px){main{padding:8px}.stage{min-height:68dvh;padding:2px}.book{height:70dvh;width:100%;max-width:480px}.sheet:first-child{display:none}.sheet:last-child{width:100%;border-radius:5px;box-shadow:none}.spine{display:none}.turn{display:none}.toolbar{gap:5px}.toolbar button,.toolbar select{padding:7px 8px;font-size:13px}.book.flipping .sheet:last-child{animation:fadePage .3s ease}@keyframes fadePage{0%{opacity:.55;transform:translateX(7px)}100%{opacity:1;transform:none}}}@media(prefers-reduced-motion:reduce){.book.flipping .turn,.book.flipping .sheet:last-child{animation:none}}

/* Compact header and controls: maximize room for the open book. */
header{padding:7px 14px;min-height:48px}header h1{font-size:clamp(15px,2vw,19px)}header a{font-size:13px;white-space:nowrap}main{padding:6px 10px}main>.hint:first-child{display:none}.toolbar{margin:4px auto 8px;gap:6px}.toolbar button,.toolbar select,.toolbar input{min-height:36px;padding:5px 9px;font-size:14px}.toolbar label{font-size:13px}.toolbar #bookSelect{max-width:min(42vw,300px)}.toolbar #counter{font-size:13px;white-space:nowrap}.stage{padding:2px 2px 8px;min-height:unset}.book{height:min(80dvh,850px)}
@media(max-width:700px){header{padding:7px 9px;gap:8px}header h1{font-size:15px}header a{font-size:12px}main{padding:5px}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:5px;margin:3px auto 7px}.toolbar label[for="bookSelect"]{display:none}.toolbar #bookSelect{grid-column:1 / -1;max-width:none;width:100%}.toolbar #prev{grid-column:1}.toolbar #counter{grid-column:2 / 4;text-align:center;font-size:12px}.toolbar #next{grid-column:4}.toolbar label[for="jump"]{display:none}.toolbar #jump{grid-column:2;width:55px;justify-self:end}.toolbar #go{grid-column:3}.toolbar button,.toolbar select,.toolbar input{font-size:12px;min-height:34px;padding:4px 6px}.stage{min-height:unset}.book{height:calc(100dvh - 210px);min-height:360px}}
@media(min-width:701px) and (max-width:1100px){.book{height:min(76dvh,850px)}}

/* One-line desktop toolbar and larger, readable book pages. */
@media(min-width:701px){
 .toolbar{display:flex;flex-wrap:nowrap;justify-content:center;gap:6px;width:100%;margin:4px auto 7px}
 .toolbar label[for="bookSelect"],.toolbar label[for="jump"]{display:none}
 .toolbar #bookSelect{flex:0 1 220px;min-width:125px;max-width:220px}
 .toolbar #counter{flex:0 0 auto;white-space:nowrap;font-size:13px}
 .toolbar #prev,.toolbar #next{flex:0 0 auto}
 .toolbar #jump{flex:0 0 64px;width:64px}
 .toolbar #go{flex:0 0 auto}
 .toolbar button,.toolbar select,.toolbar input{min-height:36px;padding:5px 7px;font-size:13px}
 .book{width:min(100%,1420px);height:min(82dvh,1000px)}
 .sheet img{object-fit:contain}
}
@media(min-width:701px) and (max-width:900px){.toolbar{gap:4px}.toolbar #bookSelect{flex-basis:145px;min-width:100px}.toolbar button,.toolbar select,.toolbar input{font-size:12px;padding:5px 4px}.toolbar #counter{font-size:12px}.toolbar #jump{flex-basis:48px;width:48px}}
@media(max-width:700px){.book{max-width:580px}.sheet img{object-fit:contain}}
.book .sheet{cursor:pointer}

</style></head><body>
<header><h1>📖 Shfletimi i librave</h1><a href="/">← Kthehu në bibliotekë</a></header>
<main>
<div class="toolbar"><label for="bookSelect">Libri</label><select id="bookSelect"><option value="Prekazi_heroik">Prekazi heroik – vatër e përhershme e luftërave për liri</option><option value="Kenge_folklorike_shqiptare">Këngë folklorike shqiptare të përzgjedhura</option><option value="Anekdota_Mesele_Popullore_Shqiptare">Anekdota – mesele popullore shqiptare dhe rrëfime tjera komike</option><option value="Azem_e_Shote_Galica">Azem e Shotë Galica në këngët popullore dhe në letërsinë e shkruar</option><option value="Kenge_popullore_shqiptare_te_perzgjedhura">Këngë popullore shqiptare të përzgjedhura</option><option value="Gramatike_krahasuese_Shqip_Suedisht">Gramatikë krahasuese e gjuhës shqipe dhe suedeze</option><option value="E_folmja_dhe_toponimia_e_Drenices">E folmja dhe toponimia e Drenicës</option><option value="Antologji_e_letersise_shqiptare">Antologji e letërsisë shqiptare</option><option value="Letersia_Shqiptare">Letërsia shqiptare</option><option value="Figura_e_Skenderbeut">Figura e Skënderbeut në trashëgiminë kulturore shqiptare dhe të huaj</option><option value="Figura_e_Bajram_Currit">Figura e Bajram Currit në këngët tona popullore epike-historike dhe në letërsinë e shkruar</option><option value="Shaban_Hamze_Adem_Jashari">Shaban, Hamzë e Adem Jashari në këngët popullore epike-historike dhe në letërsinë artistike</option><option value="Figura_e_Isa_Boletinit">Figura e Isa Boletinit në këngët tona popullore epike-historike</option></select><button id="prev" aria-label="Faqja e mëparshme">← Mbrapa</button><span id="counter">Duke u ngarkuar…</span><button id="next">Përpara →</button><label for="jump">Faqja</label><input id="jump" type="number" min="1" value="1"><button id="go">Shko</button></div>
<div class="stage"><div id="book" class="book"><div class="sheet"><img id="left" alt="Faqja e majtë"></div><div class="sheet"><img id="right" alt="Faqja e djathtë"></div><div class="spine"></div><div class="turn"><img id="turnImg" alt=""></div></div></div>
<p id="status" class="status" role="status"></p><p class="hint">Në kompjuter dhe tablet të gjerë shfaqen dy faqe. Në iPhone shfaqet një faqe më e madhe për lexim më të lehtë.</p>
</main><script>
const qs=new URLSearchParams(location.search),sel=document.getElementById('bookSelect'),left=document.getElementById('left'),right=document.getElementById('right'),counter=document.getElementById('counter'),status=document.getElementById('status'),book=document.getElementById('book'),jump=document.getElementById('jump');
let total=0,page=1,busy=false;const valid=["Prekazi_heroik","Kenge_folklorike_shqiptare","Anekdota_Mesele_Popullore_Shqiptare","Azem_e_Shote_Galica","Kenge_popullore_shqiptare_te_perzgjedhura","Gramatike_krahasuese_Shqip_Suedisht","E_folmja_dhe_toponimia_e_Drenices","Antologji_e_letersise_shqiptare","Letersia_Shqiptare","Figura_e_Skenderbeut","Figura_e_Bajram_Currit","Shaban_Hamze_Adem_Jashari","Figura_e_Isa_Boletinit"];if(valid.includes(qs.get('book')))sel.value=qs.get('book');
const single=()=>matchMedia('(max-width:700px)').matches;
function imageUrl(n){return '/api/page?book='+encodeURIComponent(sel.value)+'&page='+n}
function show(){const one=single(),leftN=one?0:(page%2===0?page:page-1),rightN=one?page:leftN+1;left.style.visibility=leftN>0&&leftN<=total?'visible':'hidden';right.style.visibility=rightN<=total?'visible':'hidden';if(leftN>0&&leftN<=total)left.src=imageUrl(leftN);if(rightN<=total)right.src=imageUrl(rightN);counter.textContent=one?'Faqja '+page+' / '+total:'Faqet '+(leftN||'–')+'–'+(rightN<=total?rightN:'–')+' / '+total;jump.value=page;try{localStorage.setItem('biblioteka:lastpage:'+sel.value,String(page))}catch(e){}document.getElementById('prev').disabled=page<=1;document.getElementById('next').disabled=page>=total;history.replaceState(null,'','?book='+encodeURIComponent(sel.value)+'&page='+page)}
async function load(){status.textContent='Duke hapur librin…';try{const r=await fetch('/api/book-info?book='+encodeURIComponent(sel.value));if(!r.ok)throw Error('Nuk u gjet libri');total=(await r.json()).pages;page=Math.max(1,Math.min(total,Number(new URLSearchParams(location.search).get('page'))||Number(localStorage.getItem('biblioteka:lastpage:'+sel.value))||1));show();status.textContent=''}catch(e){status.textContent='Nuk u arrit të hapet libri. Provo përsëri.'}}
function move(dir){if(busy||!total)return;const step=single()?1:2;const target=Math.max(1,Math.min(total,page+dir*step));if(target===page)return;busy=true;const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;if(!single()&&!reduce&&dir>0){document.getElementById('turnImg').src=right.src;book.classList.add('flipping')}else book.classList.add('flipping');setTimeout(()=>{page=target;book.classList.remove('flipping');show();busy=false},reduce?0:single()?300:550)}
// Clicking the visible left/right page turns it on laptops and desktops.
let lastTouchAt=0;
book.addEventListener('touchend',()=>{lastTouchAt=Date.now()},{passive:true});
book.addEventListener('click',e=>{
 if(Date.now()-lastTouchAt<700||busy)return;
 const bounds=book.getBoundingClientRect();
 const x=e.clientX-bounds.left;
 move(single()?(x<bounds.width*0.3?-1:1):(x<bounds.width/2?-1:1));
});
document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('go').onclick=()=>{if(!total)return;page=Math.max(1,Math.min(total,Math.trunc(Number(jump.value)||1)));show()};sel.onchange=()=>{history.replaceState(null,'','?book='+encodeURIComponent(sel.value));page=1;load()};window.addEventListener('resize',()=>{if(total)show()});document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});// Swipe navigation: horizontal gestures only; vertical scrolling stays available.
let touchStartX=0,touchStartY=0,touchStarted=false;
const stage=document.querySelector('.stage');
stage.addEventListener('touchstart',e=>{
 if(e.touches.length!==1){touchStarted=false;return}
 touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;touchStarted=true;
},{passive:true});
stage.addEventListener('touchend',e=>{
 if(!touchStarted||e.changedTouches.length!==1)return;
 touchStarted=false;
 const dx=e.changedTouches[0].clientX-touchStartX;
 const dy=e.changedTouches[0].clientY-touchStartY;
 if(Math.abs(dx)>=45&&Math.abs(dx)>Math.abs(dy)*1.3)move(dx<0?1:-1);
},{passive:true});
stage.addEventListener('touchcancel',()=>{touchStarted=false},{passive:true});
right.onerror=()=>status.textContent='Faqja nuk u ngarkua. Provo ta rifreskosh.';load();
</script></body></html>

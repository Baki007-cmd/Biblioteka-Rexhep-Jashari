</main><script>
const qs=new URLSearchParams(location.search),sel=document.getElementById('bookSelect'),left=document.getElementById('left'),right=document.getElementById('right'),counter=document.getElementById('counter'),status=document.getElementById('status'),book=document.getElementById('book'),jump=document.getElementById('jump');
let total=0,page=1,busy=false;const valid=["Prekazi_heroik","Kenge_folklorike_shqiptare","Anekdota_Mesele_Popullore_Shqiptare","Azem_e_Shote_Galica","Kenge_popullore_shqiptare_te_perzgjedhura","Gramatike_krahasuese_Shqip_Suedisht","E_folmja_dhe_toponimia_e_Drenices","Antologji_e_letersise_shqiptare","Letersia_Shqiptare","Figura_e_Skenderbeut","Figura_e_Bajram_Currit","Shaban_Hamze_Adem_Jashari","Figura_e_Isa_Boletinit"];if(valid.includes(qs.get('book')))sel.value=qs.get('book');

async function load(){status.textContent='Duke hapur librin…';try{const r=await fetch('/api/book-info?book='+encodeURIComponent(sel.value));if(!r.ok)throw Error('Nuk u gjet libri');total=(await r.json()).pages;if(lastOpened!==sel.value){lastOpened=sel.value;lastRead='';track('oppnad')}page=Math.max(1,Math.min(total,Number(new URLSearchParams(location.search).get('page'))||Number(localStorage.getItem('biblioteka:lastpage:'+sel.value))||1));show();status.textContent=''}catch(e){status.textContent='Nuk u arrit të hapet libri. Provo përsëri.'}}
function move(dir){

  const turning=document.createElement('div');

  setTimeout(()=>{turning.remove();busy=false},670);

  if(!single()&&!reduce&&dir>0){
   document.getElementById('turnImg').src=right.src;
  }

let mouseDownX=null,mouseDownY=null;

  swipeLastX=e.changedTouches[0].clientX;swipeLastY=e.changedTouches[0].clientY;
